# Passerelle API : point d'entrée unique de l'écosystème.
# Le résolveur DNS de Docker est interrogé à chaque requête (valid=10s) :
# les répliques ajoutées par `docker compose up --scale` sont prises en compte.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;

    set $stock         http://stock-service:8000;
    set $orders        http://order-service:8000;
    set $erp           http://erp-connector:8000;
    set $notifications http://notification-service:8000;
    set $conn_rest     http://shop-connector-rest:8000;
    set $conn_csv      http://shop-connector-csv:8000;
    set $boutiques     http://shop-simulator:8000;

    # Portail B2B (fichiers statiques)
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # API publique des boutiques
    location /api/catalog      { proxy_pass $stock; }
    location /api/availability { proxy_pass $stock; }
    location /api/             { proxy_pass $orders; }

    # Écran logisticien (en production : réseau interne + authentification)
    location /erp/             { proxy_pass $erp; }

    # Documentation OpenAPI et supervision de chaque service : /svc/<service>/docs
    location ~ ^/svc/stock(/.*)$         { proxy_pass $stock$1$is_args$args; }
    location ~ ^/svc/orders(/.*)$        { proxy_pass $orders$1$is_args$args; }
    location ~ ^/svc/erp(/.*)$           { proxy_pass $erp$1$is_args$args; }
    location ~ ^/svc/notifications(/.*)$ { proxy_pass $notifications$1$is_args$args; }
    location ~ ^/svc/connector-rest(/.*)$ { proxy_pass $conn_rest$1$is_args$args; }
    location ~ ^/svc/connector-csv(/.*)$  { proxy_pass $conn_csv$1$is_args$args; }

    # Logiciels des boutiques simulés (démonstration)
    location = /boutiques  { return 301 /boutiques/; }
    location ~ ^/boutiques(/.*)$ { proxy_pass $boutiques$1$is_args$args; }
}
