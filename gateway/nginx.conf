# Passerelle API : point d'entrée unique de l'écosystème.
#
# Contrôle d'accès : chaque route protégée interroge le Service Commandes
# (/api/auth/check) via auth_request. La session vient du cookie HttpOnly
# posé à la connexion, d'un jeton Bearer, ou de la clé d'API d'un logiciel de boutique.
#
# Le résolveur DNS de Docker est interrogé à chaque requête (valid=10s) :
# les répliques ajoutées par `docker compose up --scale` sont prises en compte.
resolver 127.0.0.11 valid=10s ipv6=off;

# Garde le protocole d'origine quand un tunnel HTTPS (Cloudflare) est devant la passerelle
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Limite les tentatives de connexion : 10 par minute et par adresse
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

server {
    listen 80;
    server_name _;
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_set_header X-Request-Id $request_id;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;

    set $stock         http://stock-service:8000;
    set $orders        http://order-service:8000;
    set $erp           http://erp-connector:8000;
    set $notifications http://notification-service:8000;
    set $conn_rest     http://shop-connector-rest:8000;
    set $conn_csv      http://shop-connector-csv:8000;
    set $boutiques     http://shop-simulator:8000;

    # ---------------------------------------------------------------- contrôles d'accès
    location = /_auth_any {
        internal;
        proxy_pass $orders/api/auth/check?role=any;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }
    location = /_auth_staff {
        internal;
        proxy_pass $orders/api/auth/check?role=staff;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }
    error_page 401 = @unauthorized;
    error_page 403 = @forbidden;
    location @unauthorized {
        default_type application/json;
        return 401 '{"detail":"Connexion requise"}';
    }
    location @forbidden {
        default_type application/json;
        return 403 '{"detail":"Réservé à l\'équipe Surfwear"}';
    }

    # ---------------------------------------------------------------- portail (public)
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
    }

    # ---------------------------------------------------------------- API
    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass $orders;
    }
    location /api/auth/ { proxy_pass $orders; }

    # Catalogue : toute session valide (boutique, Surfwear, clé d'API)
    location /api/catalog      { auth_request /_auth_any; proxy_pass $stock; }
    location /api/availability { auth_request /_auth_any; proxy_pass $stock; }

    # Commandes : le Service Commandes vérifie lui-même la session et le rôle
    location /api/ { proxy_pass $orders; }

    # Entrepôt et production : équipe Surfwear uniquement
    location /erp/ { auth_request /_auth_staff; proxy_pass $erp; }

    # ---------------------------------------------------------------- documentation et supervision
    # Documentation OpenAPI de chaque service (lecture seule) : /svc/<service>/docs
    location ~ ^/svc/(stock|orders|erp|notifications|connector-rest|connector-csv)/(docs|openapi\.json|health)$ {
        set $svc $1;
        set $page $2;
        set $target "";
        if ($svc = stock)          { set $target $stock; }
        if ($svc = orders)         { set $target $orders; }
        if ($svc = erp)            { set $target $erp; }
        if ($svc = notifications)  { set $target $notifications; }
        if ($svc = connector-rest) { set $target $conn_rest; }
        if ($svc = connector-csv)  { set $target $conn_csv; }
        proxy_pass $target/$page;
    }
    location = /svc/notifications/notifications { auth_request /_auth_staff; proxy_pass $notifications/notifications; }
    location = /svc/connector-rest/stats        { auth_request /_auth_staff; proxy_pass $conn_rest/stats; }
    location = /svc/connector-csv/stats         { auth_request /_auth_staff; proxy_pass $conn_csv/stats; }
    # Les routes internes des services (/internal/...) ne sont jamais exposées
    location /svc/ { return 404; }

    # Logiciels des boutiques simulés (démonstration) : équipe Surfwear
    location = /boutiques  { return 301 /boutiques/; }
    location ~ ^/boutiques(/.*)$ { auth_request /_auth_staff; proxy_pass $boutiques$1$is_args$args; }
}
