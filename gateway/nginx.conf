# Passerelle API : point d'entrée unique du portail et des microservices.
#
# Contrôle d'accès : chaque route protégée interroge le service Identité
# (/api/auth/check) via auth_request. La session vient du cookie HttpOnly posé à la
# connexion (ZITADEL), d'un jeton Bearer, ou de la clé d'API d'un logiciel de boutique.
# L'identité vérifiée est transmise aux services dans les en-têtes X-Auth-* ; ceux
# envoyés par le client sont toujours écrasés.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

limit_req_zone $binary_remote_addr zone=login:10m rate=20r/m;

server {
    listen 80;
    server_name _;
    client_max_body_size 1m;
    sendfile off;   # évite les erreurs d'E/S sur les systèmes de fichiers partagés

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # Identité transmise aux services (vide hors des routes protégées)
    set $auth_user "";
    set $auth_role "";
    set $auth_shop "";
    set $auth_name "";
    proxy_set_header X-Auth-User $auth_user;
    proxy_set_header X-Auth-Role $auth_role;
    proxy_set_header X-Auth-Shop $auth_shop;
    proxy_set_header X-Auth-Name $auth_name;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_set_header X-Request-Id $request_id;
    proxy_http_version 1.1;
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;

    set $identity      http://identity-service:8000;
    set $catalog       http://catalog-service:8000;
    set $cart          http://cart-service:8000;
    set $orders        http://order-service:8000;
    set $billing       http://billing-service:8000;
    set $stock         http://stock-service:8000;
    set $warehouse     http://warehouse-service:8000;
    set $notifications http://notification-service:8000;
    set $conn_rest     http://shop-connector-rest:8000;
    set $conn_csv      http://shop-connector-csv:8000;
    set $boutiques     http://shop-simulator:8000;

    # ---------------------------------------------------------------- contrôles d'accès
    location = /_auth_any {
        internal;
        proxy_pass $identity/api/auth/check?role=any;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }
    location = /_auth_staff {
        internal;
        proxy_pass $identity/api/auth/check?role=staff;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }
    error_page 401 = @unauthorized;
    error_page 403 = @forbidden;
    location @unauthorized {
        default_type application/json;
        return 401 '{"detail":"Connexion requise"}';
    }
    location @forbidden {
        default_type application/json;
        return 403 '{"detail":"Accès refusé : compte en attente de validation ou réservé à l\'équipe Surfwear"}';
    }

    # ---------------------------------------------------------------- portail (public)
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
    }

    # ---------------------------------------------------------------- identité (publique)
    location = /api/auth/login { limit_req zone=login burst=10 nodelay; limit_req_status 429; proxy_pass $identity; }
    location = /api/register   { limit_req zone=login burst=5 nodelay;  limit_req_status 429; proxy_pass $identity; }
    location /api/auth/        { proxy_pass $identity; }
    location /api/admin/shops  { proxy_pass $identity; }   # le service vérifie lui-même le rôle

    # ---------------------------------------------------------------- boutiques et Surfwear
    location /api/catalog {
        auth_request /_auth_any;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        auth_request_set $auth_role $upstream_http_x_auth_role;
        auth_request_set $auth_shop $upstream_http_x_auth_shop;
        auth_request_set $auth_name $upstream_http_x_auth_name;
        proxy_pass $catalog;
    }
    location /api/availability {
        auth_request /_auth_any;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        auth_request_set $auth_role $upstream_http_x_auth_role;
        auth_request_set $auth_shop $upstream_http_x_auth_shop;
        auth_request_set $auth_name $upstream_http_x_auth_name;
        proxy_pass $stock;
    }
    location /api/cart {
        auth_request /_auth_any;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        auth_request_set $auth_role $upstream_http_x_auth_role;
        auth_request_set $auth_shop $upstream_http_x_auth_shop;
        auth_request_set $auth_name $upstream_http_x_auth_name;
        proxy_pass $cart;
    }
    location ~ ^/api/(orders|admin/orders) {
        auth_request /_auth_any;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        auth_request_set $auth_role $upstream_http_x_auth_role;
        auth_request_set $auth_shop $upstream_http_x_auth_shop;
        auth_request_set $auth_name $upstream_http_x_auth_name;
        proxy_pass $orders;
    }
    location /api/invoices {
        auth_request /_auth_any;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        auth_request_set $auth_role $upstream_http_x_auth_role;
        auth_request_set $auth_shop $upstream_http_x_auth_shop;
        auth_request_set $auth_name $upstream_http_x_auth_name;
        proxy_pass $billing;
    }

    # ---------------------------------------------------------------- Surfwear uniquement
    location /api/products {
        auth_request /_auth_staff;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        auth_request_set $auth_role $upstream_http_x_auth_role;
        auth_request_set $auth_shop $upstream_http_x_auth_shop;
        auth_request_set $auth_name $upstream_http_x_auth_name;
        proxy_pass $catalog;
    }
    location /api/warehouse/ {
        auth_request /_auth_staff;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        auth_request_set $auth_role $upstream_http_x_auth_role;
        auth_request_set $auth_shop $upstream_http_x_auth_shop;
        auth_request_set $auth_name $upstream_http_x_auth_name;
        proxy_pass $warehouse;
    }
    location = /svc/notifications/notifications { auth_request /_auth_staff; proxy_pass $notifications/notifications; }
    location = /svc/connector-rest/stats        { auth_request /_auth_staff; proxy_pass $conn_rest/stats; }
    location = /svc/connector-csv/stats         { auth_request /_auth_staff; proxy_pass $conn_csv/stats; }
    location = /boutiques  { return 301 /boutiques/; }
    location ~ ^/boutiques(/.*)$ { auth_request /_auth_staff; proxy_pass $boutiques$1$is_args$args; }

    # ---------------------------------------------------------------- documentation OpenAPI (lecture)
    location ~ ^/svc/(identity|catalog|cart|orders|billing|stock|warehouse|notifications|connector-rest|connector-csv)/(docs|openapi\.json|health)$ {
        set $svc $1;
        set $page $2;
        set $target "";
        if ($svc = identity)       { set $target $identity; }
        if ($svc = catalog)        { set $target $catalog; }
        if ($svc = cart)           { set $target $cart; }
        if ($svc = orders)         { set $target $orders; }
        if ($svc = billing)        { set $target $billing; }
        if ($svc = stock)          { set $target $stock; }
        if ($svc = warehouse)      { set $target $warehouse; }
        if ($svc = notifications)  { set $target $notifications; }
        if ($svc = connector-rest) { set $target $conn_rest; }
        if ($svc = connector-csv)  { set $target $conn_csv; }
        proxy_pass $target/$page;
    }
    # Les routes internes (/internal/...) ne sont jamais exposées
    location /svc/ { return 404; }
    location /internal/ { return 404; }
}
