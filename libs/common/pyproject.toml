[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "surfwear-common"
version = "1.0.0"
description = "Bibliothèque partagée : enveloppe d'événements, bus RabbitMQ/mémoire, accès base de données"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "aio-pika>=9.4",
  "sqlalchemy[asyncio]>=2.0",
]

[tool.setuptools.packages.find]
include = ["surfwear_common*"]
