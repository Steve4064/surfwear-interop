name: surfwear

# Variables communes aux services applicatifs
x-app: &app
  restart: unless-stopped
  environment: &app-env
    BUS_URL: amqp://${RABBITMQ_USER:-surfwear}:${RABBITMQ_PASSWORD:-surfwear}@rabbitmq:5672/
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
  depends_on: &app-deps
    rabbitmq:
      condition: service_healthy

x-pg: &pg-deps
  rabbitmq:
    condition: service_healthy
  postgres:
    condition: service_healthy

services:
  # ================================================================= infrastructure
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: surfwear
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-surfwear}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surfwear"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-surfwear}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-surfwear}
    ports:
      - "127.0.0.1:15672:15672"   # console d'administration (Mac uniquement)
    volumes:
      - rabbit-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  mailpit:   # boîte mail de démonstration (reçoit les notifications)
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

  # ================================================================= identité : ZITADEL (v4)
  # Déploiement officiel ZITADEL (deploy/compose) : Traefik → API + page de connexion → PostgreSQL
  zitadel-proxy:
    image: traefik:v3.6.8
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=surfwear_default
      - --entrypoints.web.address=:80
      - --ping=true
      - --ping.entrypoint=web
    ports:
      - "${ZITADEL_PORT:-8081}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      zitadel-api:
        condition: service_healthy
      zitadel-login:
        condition: service_healthy

  zitadel-api:
    image: ghcr.io/zitadel/zitadel:${ZITADEL_VERSION:-v4.16.0}
    restart: unless-stopped
    user: "0"
    command: start-from-init --masterkey "${ZITADEL_MASTERKEY:-MasterkeyNeedsToHave32Characters}"
    environment:
      ZITADEL_PORT: 8080
      ZITADEL_EXTERNALDOMAIN: localhost
      ZITADEL_EXTERNALPORT: ${ZITADEL_PORT:-8081}
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_TLS_ENABLED: "false"
      ZITADEL_DATABASE_POSTGRES_DSN: postgresql://surfwear:${POSTGRES_PASSWORD:-surfwear}@postgres:5432/zitadel?sslmode=disable
      ZITADEL_FIRSTINSTANCE_INSTANCENAME: Surfwear Pro
      ZITADEL_FIRSTINSTANCE_DEFAULTLANGUAGE: fr
      ZITADEL_FIRSTINSTANCE_ORG_NAME: Surfwear
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: zitadel-admin
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${ZITADEL_ADMIN_PASSWORD:-Password1!}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"
      # Compte technique (propriétaire de l'instance) utilisé par zitadel-bootstrap et le service Identité
      ZITADEL_FIRSTINSTANCE_PATPATH: /zitadel/bootstrap/admin.pat
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: surfwear-bootstrap
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: Surfwear Pro (compte technique)
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: "2099-01-01T00:00:00Z"
      # Compte technique de la page de connexion (Login v2)
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /zitadel/bootstrap/login-client.pat
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: Automatically Initialized IAM_LOGIN_CLIENT
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: "2099-01-01T00:00:00Z"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "true"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: http://localhost:${ZITADEL_PORT:-8081}/ui/v2/login/
      ZITADEL_OIDC_DEFAULTLOGINURLV2: http://localhost:${ZITADEL_PORT:-8081}/ui/v2/login/login?authRequest=
      ZITADEL_OIDC_DEFAULTLOGOUTURLV2: http://localhost:${ZITADEL_PORT:-8081}/ui/v2/login/logout?post_logout_redirect=
      ZITADEL_SAML_DEFAULTLOGINURLV2: http://localhost:${ZITADEL_PORT:-8081}/ui/v2/login/login?samlRequest=
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 10s
      timeout: 30s
      retries: 18
      start_period: 30s
    volumes:
      - zitadel-bootstrap:/zitadel/bootstrap:rw
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.docker.network=surfwear_default
      - traefik.http.services.zitadel-api.loadbalancer.server.port=8080
      - traefik.http.services.zitadel-api.loadbalancer.server.scheme=h2c
      - traefik.http.middlewares.zitadel-strip-api.stripprefix.prefixes=/api
      - traefik.http.middlewares.zitadel-strip-api.stripprefix.forceSlash=false
      - traefik.http.routers.zitadel-api-alias.rule=Host(`localhost`) && PathPrefix(`/api`)
      - traefik.http.routers.zitadel-api-alias.entrypoints=web
      - traefik.http.routers.zitadel-api-alias.middlewares=zitadel-strip-api
      - traefik.http.routers.zitadel-api-alias.service=zitadel-api
      - traefik.http.routers.zitadel-api-alias.priority=200
      - traefik.http.routers.zitadel-canonical.rule=Host(`localhost`) && !PathPrefix(`/ui/v2/login`) && !PathPrefix(`/api`) && !Path(`/`)
      - traefik.http.routers.zitadel-canonical.entrypoints=web
      - traefik.http.routers.zitadel-canonical.service=zitadel-api
      - traefik.http.routers.zitadel-canonical.priority=100

  zitadel-login:
    image: ghcr.io/zitadel/zitadel-login:${ZITADEL_VERSION:-v4.16.0}
    restart: unless-stopped
    user: "0"
    environment:
      ZITADEL_API_URL: http://zitadel-api:8080
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
      ZITADEL_SERVICE_USER_TOKEN_FILE: /zitadel/bootstrap/login-client.pat
      ZITADEL_SESSION_COOKIE_SECRET: ${LOGIN_SESSION_COOKIE_SECRET:-SessionCookieSecretNeedsAtLeast32Chars}
      CUSTOM_REQUEST_HEADERS: Host:localhost,X-Forwarded-Proto:http
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "node /app/healthcheck.mjs http://localhost:3000/ui/v2/login/healthy"]
      interval: 10s
      timeout: 30s
      retries: 18
      start_period: 20s
    volumes:
      - zitadel-bootstrap:/zitadel/bootstrap:ro
    depends_on:
      zitadel-api:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.docker.network=surfwear_default
      - traefik.http.services.zitadel-login.loadbalancer.server.port=3000
      - traefik.http.middlewares.zitadel-root-rewrite.replacepath.path=/ui/v2/login/
      - traefik.http.routers.zitadel-root.rule=Host(`localhost`) && Path(`/`)
      - traefik.http.routers.zitadel-root.entrypoints=web
      - traefik.http.routers.zitadel-root.middlewares=zitadel-root-rewrite
      - traefik.http.routers.zitadel-root.service=zitadel-login
      - traefik.http.routers.zitadel-root.priority=400
      - traefik.http.routers.zitadel-login.rule=Host(`localhost`) && PathPrefix(`/ui/v2/login`)
      - traefik.http.routers.zitadel-login.entrypoints=web
      - traefik.http.routers.zitadel-login.service=zitadel-login
      - traefik.http.routers.zitadel-login.priority=250

  zitadel-bootstrap:   # configure ZITADEL une fois : projet, application OIDC, équipe Surfwear, boutiques de démo
    build:
      context: .
      dockerfile: infra/zitadel/Dockerfile
    restart: on-failure
    environment:
      ZITADEL_INTERNAL_URL: http://zitadel-api:8080
      ZITADEL_DOMAIN: localhost
      BOOTSTRAP_DIR: /bootstrap
      PORTAL_PUBLIC_URLS: http://localhost:${GATEWAY_PORT:-8080},http://127.0.0.1:${GATEWAY_PORT:-8080}
      STAFF_EMAIL: ${STAFF_EMAIL:-equipe@surfwear.example}
      STAFF_PASSWORD: ${STAFF_PASSWORD:-Surfwear2026!}
      DEMO_ACCOUNTS_FILE: /config/zitadel-demo.json
    volumes:
      - zitadel-bootstrap:/bootstrap
      - ./config:/config:ro
    depends_on:
      zitadel-api:
        condition: service_healthy

  # ================================================================= microservices
  identity-service:
    <<: *app
    build: { context: ., dockerfile: services/identity-service/Dockerfile }
    user: "0"   # lit le jeton technique écrit par ZITADEL dans le volume partagé
    environment:
      <<: *app-env
      DATABASE_URL: postgresql+asyncpg://surfwear:${POSTGRES_PASSWORD:-surfwear}@postgres:5432/identity
      AUTH_PROVIDER: ${AUTH_PROVIDER:-zitadel}
      AUTH_SECRET: ${AUTH_SECRET:-change-me-in-env-file}
      STAFF_API_KEY: ${STAFF_API_KEY:-}
      HOLD_MINUTES: ${HOLD_MINUTES:-15}
      PUBLIC_URL: http://localhost:${GATEWAY_PORT:-8080}
      ZITADEL_PUBLIC_URL: http://localhost:${ZITADEL_PORT:-8081}
      ZITADEL_INTERNAL_URL: http://zitadel-api:8080
      ZITADEL_DOMAIN: localhost
      ZITADEL_BOOTSTRAP_FILE: /bootstrap/zitadel.json
      ZITADEL_ADMIN_PAT_FILE: /bootstrap/admin.pat
      SHOPS_FILE: /config/shops.json
      USERS_FILE: /config/users.json
      ROOT_PATH: /svc/identity
    volumes:
      - ./config:/config:ro
      - zitadel-bootstrap:/bootstrap:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      start_period: 300s   # attend la configuration ZITADEL au premier démarrage
      retries: 5
    depends_on: *pg-deps

  catalog-service:
    <<: *app
    build: { context: ., dockerfile: services/catalog-service/Dockerfile }
    environment:
      <<: *app-env
      DATABASE_URL: postgresql+asyncpg://surfwear:${POSTGRES_PASSWORD:-surfwear}@postgres:5432/catalog
      CATALOG_FILE: /config/catalog.json
      STOCK_URL: http://stock-service:8000
      ROOT_PATH: /svc/catalog
    volumes:
      - ./config:/config:ro
    depends_on: *pg-deps

  cart-service:
    <<: *app
    build: { context: ., dockerfile: services/cart-service/Dockerfile }
    environment:
      <<: *app-env
      DATABASE_URL: postgresql+asyncpg://surfwear:${POSTGRES_PASSWORD:-surfwear}@postgres:5432/cart
      CATALOG_URL: http://catalog-service:8000
      ORDERS_URL: http://order-service:8000
      ROOT_PATH: /svc/cart
    depends_on: *pg-deps

  order-service:
    <<: *app
    build: { context: ., dockerfile: services/order-service/Dockerfile }
    environment:
      <<: *app-env
      DATABASE_URL: postgresql+asyncpg://surfwear:${POSTGRES_PASSWORD:-surfwear}@postgres:5432/orders
      STOCK_URL: http://stock-service:8000
      IDENTITY_URL: http://identity-service:8000
      HOLD_MINUTES: ${HOLD_MINUTES:-15}
      ROOT_PATH: /svc/orders
    depends_on: *pg-deps

  billing-service:
    <<: *app
    build: { context: ., dockerfile: services/billing-service/Dockerfile }
    environment:
      <<: *app-env
      DATABASE_URL: postgresql+asyncpg://surfwear:${POSTGRES_PASSWORD:-surfwear}@postgres:5432/billing
      ORDERS_URL: http://order-service:8000
      IDENTITY_URL: http://identity-service:8000
      CATALOG_URL: http://catalog-service:8000
      ROOT_PATH: /svc/billing
    depends_on: *pg-deps

  stock-service:
    <<: *app
    build: { context: ., dockerfile: services/stock-service/Dockerfile }
    environment:
      <<: *app-env
      DATABASE_URL: postgresql+asyncpg://surfwear:${POSTGRES_PASSWORD:-surfwear}@postgres:5432/stock
      ERP_URL: http://warehouse-service:8000
      ROOT_PATH: /svc/stock
    depends_on:
      <<: *pg-deps
      warehouse-service:
        condition: service_healthy

  warehouse-service:
    <<: *app
    build: { context: ., dockerfile: services/warehouse-service/Dockerfile }
    environment:
      <<: *app-env
      DATABASE_URL: sqlite+aiosqlite:////data/warehouse.db
      CATALOG_FILE: /config/catalog.json
      ROOT_PATH: /svc/warehouse
    volumes:
      - ./config:/config:ro
      - warehouse-data:/data

  notification-service:
    <<: *app
    build: { context: ., dockerfile: services/notification-service/Dockerfile }
    environment:
      <<: *app-env
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      STAFF_EMAIL: ${STAFF_EMAIL:-equipe@surfwear.example}
      ROOT_PATH: /svc/notifications

  # ================================================================= intégration des logiciels de boutique
  shop-connector-rest:   # éditeur A : webhooks JSON signés
    <<: *app
    build: { context: ., dockerfile: services/shop-connector/Dockerfile }
    image: surfwear/shop-connector:latest
    environment:
      <<: *app-env
      ADAPTER: rest
      VENDOR_A_URL: http://shop-simulator:8000
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-change-me}
      ROOT_PATH: /svc/connector-rest

  shop-connector-csv:    # éditeur B : fichiers CSV déposés
    <<: *app
    image: surfwear/shop-connector:latest   # même image, autre adaptateur
    environment:
      <<: *app-env
      ADAPTER: csv
      EXCHANGE_DIR: /exchange
      ROOT_PATH: /svc/connector-csv
    volumes:
      - exchange:/exchange
    depends_on:
      <<: *app-deps
      shop-connector-rest:
        condition: service_started   # garantit que l'image est construite

  shop-simulator:   # logiciels des boutiques simulés (démonstration)
    restart: unless-stopped
    build: { context: ., dockerfile: services/shop-simulator/Dockerfile }
    environment:
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-change-me}
      EXCHANGE_DIR: /exchange
      ROOT_PATH: /boutiques
    volumes:
      - exchange:/exchange:ro

  # ================================================================= point d'entrée
  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./portal:/usr/share/nginx/html:ro
    depends_on:
      identity-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      cart-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      warehouse-service:
        condition: service_healthy

volumes:
  pg-data:
  rabbit-data:
  warehouse-data:
  exchange:
  zitadel-bootstrap:
